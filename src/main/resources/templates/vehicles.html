
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            margin: 0;
            padding: 0;
            color: #263238;
        }

        .container {
            max-width: 1400px;
            margin-left: 250px;
            padding: 30px;
            box-sizing: border-box;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 220px;
            height: 100vh;
            padding: 25px 15px;
            box-sizing: border-box;
            background: #17365d;
            color: white;
            overflow-y: auto;
        }

        .sidebar h2 {
            color: white;
            margin-bottom: 30px;
        }

        .sidebar nav a {
            display: block;
            color: #e5edf7;
            text-decoration: none;
            padding: 13px 12px;
            margin-bottom: 6px;
            border-radius: 6px;
        }

        .sidebar nav a:hover,
        .sidebar nav a.active {
            background: #2878b5;
            color: white;
        }

        @media (max-width: 700px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .container {
                margin-left: 0;
                padding: 20px;
            }
        }

        h1, h2 {
            color: #17365d;
        }

        .panel {
            background: white;
            padding: 24px;
            margin-top: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5eaf0;
        }

        th {
            background: #edf3fa;
            color: #17365d;
        }

        .button {
            display: inline-block;
            padding: 9px 14px;
            border-radius: 6px;
            text-decoration: none;
            color: white;
            font-size: 14px;
            border: none;
            cursor: pointer;
        }

        .add {
            background: #17365d;
        }

        .edit {
            background: #2878b5;
        }

        .delete {
            background: #c62828;
        }

        .back {
            background: #546575;
        }

        .success {
            color: #18753c;
            background: #e8f7ed;
            padding: 12px;
            border-radius: 6px;
        }

        .error {
            color: #b42318;
            background: #fdecec;
            padding: 12px;
            border-radius: 6px;
        }

        .empty {
            color: #666;
            padding: 20px 0;
        }

        .actions {
            white-space: nowrap;
        }

        .actions form {
            display: inline;
        }

        
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 16px 0;
            align-items: center;
        }

        .filter-bar input,
        .filter-bar select {
            padding: 10px 12px;
            border: 1px solid #ccd6e0;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            min-width: 180px;
        }

        .filter-bar input {
            flex: 1;
        }

        .filter-bar button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            background: #546575;
            color: white;
            cursor: pointer;
        }

        .filter-count {
            color: #546575;
            font-size: 14px;
            margin-bottom: 10px;
        }


    </style>
</head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="container">

    <h1>Vehicle Management</h1>
    <p>Register vehicles and manage their FASTag and pass details.</p>

    <p>
        <a class="button add" th:href="@{/vehicles/new}">
            + Add Vehicle
        </a>

        <a class="button back" th:href="@{/}">
            Back to Dashboard
        </a>
    </p>

    <p class="success"
       th:if="${success}"
       th:text="${success}">
    </p>

    <p class="error"
       th:if="${error}"
       th:text="${error}">
    </p>

    <div class="panel">

        <h2>Registered Vehicles</h2>

        
        <div class="filter-bar">
            <input type="text"
                   id="vehicleSearch"
                   placeholder="Search vehicle or FASTag number...">

            <select id="passTypeFilter">
                <option value="">All Pass Types</option>
            </select>

            <select id="categoryFilter">
                <option value="">All Categories</option>
            </select>

            <button type="button" id="resetFilters">Reset</button>
        </div>

        <p class="filter-count" id="filterCount"></p>


        <p class="empty" th:if="${#lists.isEmpty(vehicles)}">
            No vehicles found in the database.
        </p>

        <table th:unless="${#lists.isEmpty(vehicles)}">

            <thead>
            <tr>
                <th>Vehicle ID</th>
                <th>Vehicle Number</th>
                <th>FASTag Number</th>
                <th>Pass ID</th>
                <th>Pass Type</th>
                <th>Category</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="vehicle : ${vehicles}">

                <td th:text="${vehicle.vehicleId}"></td>
                <td th:text="${vehicle.vehicleNumber}"></td>
                <td th:text="${vehicle.fasTagNumber != null ? vehicle.fasTagNumber : '-'}"></td>
                <td th:text="${vehicle.passId != null ? vehicle.passId : '-'}"></td>
                <td th:text="${vehicle.passType != null ? vehicle.passType : '-'}"></td>
                <td th:text="${vehicle.vehicleCategory != null ? vehicle.vehicleCategory : '-'}"></td>

                <td class="actions">

                    <a class="button edit"
                       th:href="@{/vehicles/edit/{id}(id=${vehicle.vehicleId})}">
                        Edit
                    </a>

                    <form th:action="@{/vehicles/delete/{id}(id=${vehicle.vehicleId})}"
                          method="post"
                          onsubmit="return confirm('Are you sure you want to delete this vehicle?');">

                        <button type="submit" class="button delete">
                            Delete
                        </button>
                    </form>

                </td>

            </tr>
            </tbody>

        </table>

    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const search = document.getElementById("vehicleSearch");
    const passFilter = document.getElementById("passTypeFilter");
    const categoryFilter = document.getElementById("categoryFilter");
    const resetButton = document.getElementById("resetFilters");
    const count = document.getElementById("filterCount");
    const rows = Array.from(document.querySelectorAll("tbody tr"));

    function populateFilter(select, columnIndex) {
        const values = [...new Set(
            rows.map(row => row.cells[columnIndex]?.textContent.trim())
                .filter(value => value && value !== "-")
        )].sort();

        values.forEach(value => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = value;
            select.appendChild(option);
        });
    }

    // Table columns: Pass Type = 4, Category = 5
    populateFilter(passFilter, 4);
    populateFilter(categoryFilter, 5);

    function applyFilters() {
        const query = search.value.trim().toLowerCase();
        const selectedPass = passFilter.value;
        const selectedCategory = categoryFilter.value;
        let visible = 0;

        rows.forEach(row => {
            const vehicleNumber =
                row.cells[1]?.textContent.trim().toLowerCase() || "";
            const fastagNumber =
                row.cells[2]?.textContent.trim().toLowerCase() || "";
            const passType = row.cells[4]?.textContent.trim() || "";
            const category = row.cells[5]?.textContent.trim() || "";

            const matchesSearch =
                vehicleNumber.includes(query) ||
                fastagNumber.includes(query);

            const matchesPass =
                !selectedPass || passType === selectedPass;

            const matchesCategory =
                !selectedCategory || category === selectedCategory;

            const matches =
                matchesSearch && matchesPass && matchesCategory;

            row.style.display = matches ? "" : "none";

            if (matches) visible++;
        });

        count.textContent = `Showing ${visible} of ${rows.length} vehicles`;
    }

    search.addEventListener("input", applyFilters);
    passFilter.addEventListener("change", applyFilters);
    categoryFilter.addEventListener("change", applyFilters);

    resetButton.addEventListener("click", function () {
        search.value = "";
        passFilter.value = "";
        categoryFilter.value = "";
        applyFilters();
    });

    applyFilters();
});
</script>

</body>

</html>
