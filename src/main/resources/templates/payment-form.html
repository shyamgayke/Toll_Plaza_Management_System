
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${formTitle}">Payment Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            margin: 0;
            padding: 30px;
            color: #243247;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0000000d;
        }

        h1 { margin-top: 0; }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .secondary { background: #475569; }

        .error {
            color: #991b1b;
            background: #fee2e2;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>

<body>
<div class="container">

    <h1 th:text="${formTitle}">Payment Form</h1>

    <p class="error"
       th:if="${error}"
       th:text="${error}"></p>

    <form th:action="${formAction}" th:object="${payment}" method="post">

        <label for="paymentId">Payment ID</label>
        <input type="number"
               id="paymentId"
               th:field="*{paymentId}"
               required
               min="1"
               th:readonly="${formTitle == 'Edit Payment'}">

        <label for="paymentDate">Payment Date</label>
        <input type="date"
               id="paymentDate"
               th:field="*{paymentDate}"
               th:attr="max=${today}">

        <label for="vehicleId">Vehicle</label>
        <select id="vehicleId" th:field="*{vehicleId}">
            <option value="">-- No Vehicle Selected --</option>
            <option th:each="vehicle : ${vehicles}"
                    th:value="${vehicle.vehicleId}"
                    th:text="${vehicle.vehicleNumber}">
            </option>
        </select>

        <label for="boothId">Toll Booth</label>
        <select id="boothId" th:field="*{boothId}">
            <option value="">-- No Booth Selected --</option>
            <option th:each="booth : ${booths}"
                    th:value="${booth.boothId}"
                    th:text="${'Booth ' + booth.boothId + ' - ' + booth.boothStatus}">
            </option>
        </select>

        <label for="paymentMode">Payment Mode</label>
        <select id="paymentMode" th:field="*{paymentMode}" required>
            <option value="">-- Select Payment Mode --</option>
            <option value="FASTag">FASTag</option>
            <option value="Cash">Cash</option>
            <option value="Card">Card</option>
        </select>

        <label for="paymentStatus">Payment Status</label>
        <select id="paymentStatus" th:field="*{paymentStatus}">
            <option value="Completed">Completed</option>
            <option value="Pending">Pending</option>
            <option value="Failed">Failed</option>
        </select>

        <label for="tollAmount">Toll Amount</label>
        <input type="number"
               id="tollAmount"
               th:field="*{tollAmount}"
               min="0.01"
               step="0.01"
               required>

        <div class="actions">
            <button type="submit" class="btn">Save Payment</button>
            <a class="btn secondary" th:href="@{/payments}">Cancel</a>
        </div>

    </form>
</div>
</body>
</html>
