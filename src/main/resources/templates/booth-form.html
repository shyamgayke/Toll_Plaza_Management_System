
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${formTitle}">Toll Booth Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            margin: 0;
            padding: 30px;
            color: #243247;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 { margin-top: 0; }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input, select {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }

        button, a {
            display: inline-block;
            margin-top: 22px;
            padding: 11px 16px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        button { background: #2563eb; color: white; }
        a { background: #e5e7eb; color: #111827; }

        .error {
            padding: 12px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 6px;
        }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .container { padding: 18px; }
        }
    </style>
</head>

<body>
<div class="container">

    <h1 th:text="${formTitle}">Toll Booth Form</h1>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form th:action="${formAction}" th:object="${booth}" method="post">

        <label for="boothId">Booth ID</label>

        <input th:if="${booth.boothId == null}"
               type="number"
               id="boothId"
               th:field="*{boothId}"
               min="1"
               required>

        <input th:if="${booth.boothId != null}"
               type="number"
               id="boothId"
               th:field="*{boothId}"
               readonly>

        <label for="plazaId">Toll Plaza</label>

        <select id="plazaId" th:field="*{plazaId}" required>
            <option value="">-- Select Toll Plaza --</option>
            <option th:each="plaza : ${plazas}"
                    th:value="${plaza.plazaId}"
                    th:text="${plaza.plazaName + ' (ID: ' + plaza.plazaId + ')'}">
            </option>
        </select>

        <label for="boothStatus">Booth Status</label>

        <select id="boothStatus" th:field="*{boothStatus}" required>
            <option value="">-- Select Status --</option>
            <option value="Active">Active</option>
            <option value="Maintenance">Maintenance</option>
            <option value="Inactive">Inactive</option>
        </select>

        <button type="submit">Save Booth</button>
        <a th:href="@{/booths}">Cancel</a>

    </form>
</div>
</body>
</html>
